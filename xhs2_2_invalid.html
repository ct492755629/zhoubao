<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1440px;overflow:hidden;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#FDF8F4;
display:flex;flex-direction:column;padding:90px 80px;}
.tag{align-self:flex-start;background:#F4E2DB;color:#C8442F;font-size:34px;font-weight:700;
padding:14px 32px;border-radius:999px;margin-bottom:44px;}
h1{font-size:88px;font-weight:900;color:#23272E;line-height:1.15;margin-bottom:48px;}
.bad{background:#fff;border-radius:24px;padding:38px 42px;margin-bottom:30px;
box-shadow:0 6px 22px rgba(200,68,47,0.07);}
.bad .h{display:flex;align-items:center;font-size:46px;font-weight:900;color:#D0523F;margin-bottom:14px;}
.x{width:54px;height:54px;border-radius:50%;background:#F6D9D2;color:#C8442F;font-size:36px;
display:flex;align-items:center;justify-content:center;margin-right:22px;flex-shrink:0;font-weight:900;}
.bad .d{font-size:35px;color:#5b626b;line-height:1.5;padding-left:76px;}
.tip{margin-top:auto;background:#F4E2DB;border-radius:20px;padding:34px 40px;
font-size:37px;color:#9c3322;font-weight:700;text-align:center;line-height:1.5;}
</style>
</head>
<body>
<div class="tag">无效周报盘点</div>
<h1>这3种，领导直接划走</h1>
<div class="bad"><div class="h"><span class="x">×</span>流水账式</div><div class="d">周一开会、周二对接、周三写文档，只有过程没有产出。</div></div>
<div class="bad"><div class="h"><span class="x">×</span>请假条式</div><div class="d">通篇"本周无异常、一切正常"，领导看完更不放心。</div></div>
<div class="bad"><div class="h"><span class="x">×</span>读后感式</div><div class="d">"本周收获很大、感谢领导栽培"，全是情绪没有事实。</div></div>
<div class="tip">周报是给领导看结果的，不是表忠心的</div>
</body>
</html>
