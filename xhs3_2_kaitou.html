<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1440px;overflow:hidden;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#FDF8F4;
display:flex;flex-direction:column;padding:80px 70px;}
.tag{align-self:flex-start;background:#F4E2DB;color:#C8442F;font-size:32px;font-weight:700;
padding:12px 30px;border-radius:999px;margin-bottom:36px;}
h2{font-size:62px;font-weight:900;color:#23272E;line-height:1.2;margin-bottom:44px;}
h2 .hl{color:#C8442F;}
.kcard{flex:1;background:#fff;border:1px solid #EFDDD6;border-radius:24px;padding:38px 40px;
margin-bottom:30px;display:flex;flex-direction:column;justify-content:center;}
.khead{display:flex;align-items:center;gap:20px;margin-bottom:18px;}
.num{width:62px;height:62px;background:#C8442F;color:#fff;border-radius:50%;font-size:36px;
font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ktype{font-size:42px;font-weight:900;color:#23272E;}
.ksen{font-size:34px;color:#444B57;line-height:1.55;background:#FBF1ED;border-radius:14px;
padding:22px 26px;}
.ksen .b{color:#C8442F;font-weight:700;}
</style>
</head>
<body>
<div class="tag">开头篇 · 3种写法</div>
<h2>周报开头怎么写？<br><span class="hl">直接抄这3句</span></h2>
<div class="kcard">
<div class="khead"><div class="num">1</div><div class="ktype">常规汇报式</div></div>
<div class="ksen">领导好，现将本周（X.X-X.X）<span class="b">工作情况汇报如下</span>。</div>
</div>
<div class="kcard">
<div class="khead"><div class="num">2</div><div class="ktype">数据开门式</div></div>
<div class="ksen">本周重点推进X项目，<span class="b">完成X、核心指标达X</span>，整体进展符合预期。</div>
</div>
<div class="kcard">
<div class="khead"><div class="num">3</div><div class="ktype">总结概括式</div></div>
<div class="ksen">本周围绕X开展，<span class="b">已完成X、X</span>，具体情况汇报如下。</div>
</div>
</body>
</html>
