<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1440px;overflow:hidden;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#FDF8F4;
display:flex;flex-direction:column;padding:90px 80px;position:relative;}
.tag{align-self:flex-start;background:#F4E2DB;color:#C8442F;font-size:34px;font-weight:700;
padding:14px 32px;border-radius:999px;margin-bottom:60px;}
h1{font-size:118px;font-weight:900;color:#23272E;line-height:1.18;letter-spacing:2px;}
h1 .hl{color:#C8442F;}
.sub{font-size:46px;color:#5B6574;font-weight:600;margin-top:40px;line-height:1.5;}
.card{margin-top:64px;background:#fff;border-radius:28px;padding:54px 50px;
box-shadow:0 8px 30px rgba(200,68,47,0.08);}
.row{display:flex;align-items:center;font-size:42px;color:#23272E;font-weight:600;padding:18px 0;}
.dot{width:26px;height:26px;border-radius:50%;background:#C8442F;margin-right:28px;flex-shrink:0;}
.bottom{margin-top:auto;background:#C8442F;color:#fff;border-radius:28px;
padding:42px;text-align:center;}
.bottom .b1{font-size:48px;font-weight:900;}
.bottom .b2{font-size:34px;margin-top:12px;opacity:0.95;}
</style>
</head>
<body>
<div class="tag">打工人必备 · 周五救命</div>
<h1>周报别再<span class="hl">憋了！</span></h1>
<div class="sub">这套万能模板，3分钟搞定<br>领导看了都点赞</div>
<div class="card">
<div class="row"><span class="dot"></span>一句话总结本周成果</div>
<div class="row"><span class="dot"></span>完成事项 + 数据结果</div>
<div class="row"><span class="dot"></span>遇到问题 + 解决办法</div>
<div class="row"><span class="dot"></span>下周只列3件最重要</div>
</div>
<div class="bottom">
<div class="b1">免费周报生成器</div>
<div class="b2">不用注册 · 打开网页就能用</div>
</div>
</body>
</html>
