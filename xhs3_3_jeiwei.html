<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1440px;overflow:hidden;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#FDF8F4;
display:flex;flex-direction:column;padding:80px 70px;}
.tag{align-self:flex-start;background:#F4E2DB;color:#C8442F;font-size:32px;font-weight:700;
padding:12px 30px;border-radius:999px;margin-bottom:36px;}
h2{font-size:62px;font-weight:900;color:#23272E;line-height:1.2;margin-bottom:40px;}
h2 .hl{color:#C8442F;}
.kcard{background:#fff;border:1px solid #EFDDD6;border-radius:24px;padding:32px 38px;
margin-bottom:26px;}
.khead{display:flex;align-items:center;gap:20px;margin-bottom:14px;}
.num{width:58px;height:58px;background:#C8442F;color:#fff;border-radius:50%;font-size:33px;
font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ktype{font-size:40px;font-weight:900;color:#23272E;}
.ksen{font-size:32px;color:#444B57;line-height:1.5;background:#FBF1ED;border-radius:14px;
padding:20px 24px;}
.ksen .b{color:#C8442F;font-weight:700;}
.bottom{margin-top:auto;background:#C8442F;color:#fff;border-radius:26px;padding:36px 40px;text-align:center;
font-size:38px;font-weight:800;line-height:1.45;}
.bottom .small{font-size:30px;font-weight:600;opacity:.95;display:block;margin-top:8px;}
</style>
</head>
<body>
<div class="tag">结尾篇 · 显态度</div>
<h2>周报结尾怎么写？<span class="hl">3句收好</span></h2>
<div class="kcard">
<div class="khead"><div class="num">1</div><div class="ktype">计划式</div></div>
<div class="ksen">下周重点推进X、完成X，<span class="b">确保项目按计划落地</span>。</div>
</div>
<div class="kcard">
<div class="khead"><div class="num">2</div><div class="ktype">表态式</div></div>
<div class="ksen">以上为本周工作，<span class="b">不足之处请您指正</span>，我会及时调整。</div>
</div>
<div class="kcard">
<div class="khead"><div class="num">3</div><div class="ktype">协作式</div></div>
<div class="ksen">感谢X的支持，<span class="b">需协调事项已说明</span>，恳请支持。</div>
</div>
<div class="bottom">懒得自己组织？周报助手填关键词自动生成
<span class="small">结构现成 · 一键复制 · 免费使用</span></div>
</body>
</html>
