<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1440px;overflow:hidden;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#FDF8F4;
display:flex;flex-direction:column;padding:90px 80px;}
.tag{align-self:flex-start;background:#F4E2DB;color:#C8442F;font-size:34px;font-weight:700;
padding:14px 32px;border-radius:999px;margin-bottom:44px;}
h1{font-size:88px;font-weight:900;color:#23272E;line-height:1.15;margin-bottom:48px;}
.formula{background:#fff;border-radius:24px;padding:48px 44px;
box-shadow:0 6px 22px rgba(200,68,47,0.07);}
.fstep{display:flex;align-items:center;font-size:44px;font-weight:800;color:#23272E;padding:20px 0;}
.fnum{width:60px;height:60px;border-radius:50%;background:#C8442F;color:#fff;font-size:34px;
display:flex;align-items:center;justify-content:center;margin-right:26px;flex-shrink:0;font-weight:900;}
.arrow{text-align:center;font-size:40px;color:#C8442F;font-weight:900;padding:2px 0;}
.example{margin-top:40px;background:#E7F2E6;border-radius:22px;padding:38px 42px;}
.example .h{font-size:40px;font-weight:900;color:#3c7a39;margin-bottom:14px;}
.example .d{font-size:35px;color:#3c5438;line-height:1.6;}
.url{margin-top:auto;background:#C8442F;border-radius:24px;padding:42px;text-align:center;}
.url .u{font-size:66px;font-weight:900;color:#fff;}
.url .n{font-size:33px;color:#FDE7E0;margin-top:12px;}
</style>
</head>
<body>
<div class="tag">正确公式</div>
<h1>记住这三步就够了</h1>
<div class="formula">
<div class="fstep"><span class="fnum">1</span>做了什么</div>
<div class="arrow">↓</div>
<div class="fstep"><span class="fnum">2</span>拿到什么结果</div>
<div class="arrow">↓</div>
<div class="fstep"><span class="fnum">3</span>下一步怎么办</div>
</div>
<div class="example"><div class="h">举个例子</div><div class="d">完成首页改版（做了什么），使注册转化率提升20%（结果），下周继续优化落地页（下一步）。</div></div>
<div class="url"><div class="u">zhoubaozhu.cloud</div><div class="n">免费生成器，结构现成填关键词就行</div></div>
</body>
</html>
