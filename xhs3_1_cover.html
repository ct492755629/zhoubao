<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1440px;overflow:hidden;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#FDF8F4;
display:flex;flex-direction:column;padding:90px 80px;}
.tag{align-self:flex-start;background:#F4E2DB;color:#C8442F;font-size:34px;font-weight:700;
padding:14px 32px;border-radius:999px;margin-bottom:60px;}
h1{font-size:108px;font-weight:900;color:#23272E;line-height:1.18;}
h1 .hl{color:#C8442F;}
.sub{font-size:44px;color:#5B6574;font-weight:600;margin-top:42px;line-height:1.55;}
.demo{margin-top:64px;display:flex;flex-direction:column;gap:28px;}
.dbox{background:#fff;border:1px solid #EFDDD6;border-radius:22px;padding:34px 38px;}
.dbox .dt{font-size:36px;font-weight:900;color:#C8442F;margin-bottom:12px;}
.dbox .ds{font-size:33px;color:#333A45;line-height:1.5;}
.bottom{margin-top:auto;background:#C8442F;color:#fff;border-radius:28px;padding:40px;text-align:center;
font-size:42px;font-weight:800;}
</style>
</head>
<body>
<div class="tag">周报模板 · 建议收藏</div>
<h1>周报开头结尾<br><span class="hl">万能句式！</span></h1>
<div class="sub">别再写"本周无异常"了<br>这些句式领导看了印象好</div>
<div class="demo">
<div class="dbox"><div class="dt">开头</div><div class="ds">现将本周工作汇报如下……</div></div>
<div class="dbox"><div class="dt">结尾</div><div class="ds">下周重点推进，确保落地……</div></div>
</div>
<div class="bottom">收藏起来，周五直接抄</div>
</body>
</html>
