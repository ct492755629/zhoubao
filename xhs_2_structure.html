<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1440px;overflow:hidden;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#FDF8F4;
display:flex;flex-direction:column;padding:90px 80px;}
.tag{align-self:flex-start;background:#F4E2DB;color:#C8442F;font-size:34px;font-weight:700;
padding:14px 32px;border-radius:999px;margin-bottom:44px;}
h1{font-size:92px;font-weight:900;color:#23272E;line-height:1.15;margin-bottom:44px;}
.block{background:#fff;border-radius:24px;padding:38px 42px;margin-bottom:30px;
box-shadow:0 6px 22px rgba(200,68,47,0.07);border-left:14px solid #C8442F;}
.block .t{font-size:44px;font-weight:900;color:#C8442F;margin-bottom:14px;}
.block .e{font-size:35px;color:#444b54;line-height:1.5;}
.tip{margin-top:auto;background:#F4E2DB;border-radius:20px;padding:34px 40px;
font-size:38px;color:#9c3322;font-weight:700;text-align:center;}
</style>
</head>
<body>
<div class="tag">周报万能结构</div>
<h1>四段式，照着填</h1>
<div class="block"><div class="t">① 一句话总结</div><div class="e">本周核心推进X项目，完成A、B两项，整体进度符合预期。</div></div>
<div class="block"><div class="t">② 本周完成（动词+事+结果）</div><div class="e">主导需求评审、确定范围，排期缩短2天；输出竞品报告，为V2决策提供依据。</div></div>
<div class="block"><div class="t">③ 问题与解决</div><div class="e">第三方接口排期偏晚，已对齐资源，预计下周三恢复，不影响整体版本。</div></div>
<div class="block"><div class="t">④ 下周计划（只列3件）</div><div class="e">跟进V2开发、输出V3需求初稿、完成数据复盘。</div></div>
<div class="tip">小技巧：每一项都尽量带数据，说服力翻倍</div>
</body>
</html>
