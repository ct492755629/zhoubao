<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1440px;overflow:hidden;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#FDF8F4;
display:flex;flex-direction:column;padding:90px 80px;}
.tag{align-self:flex-start;background:#F4E2DB;color:#C8442F;font-size:34px;font-weight:700;
padding:14px 32px;border-radius:999px;margin-bottom:56px;}
h1{font-size:112px;font-weight:900;color:#23272E;line-height:1.16;}
h1 .hl{color:#C8442F;}
.sub{font-size:44px;color:#5B6574;font-weight:600;margin-top:38px;line-height:1.5;}
.cmp{margin-top:60px;display:flex;gap:26px;}
.cbox{flex:1;border-radius:24px;padding:40px 34px;}
.cbox.bad{background:#EFEDEA;border:1px solid #E2DFD7;}
.cbox.good{background:#fff;border:2px solid #C8442F;}
.ct{font-size:38px;font-weight:900;margin-bottom:20px;}
.cbox.bad .ct{color:#8A93A0;}
.cbox.good .ct{color:#C8442F;}
.cline{font-size:31px;line-height:1.6;}
.cbox.bad .cline{color:#8A93A0;}
.cbox.good .cline{color:#333A45;}
.bottom{margin-top:auto;background:#C8442F;color:#fff;border-radius:28px;padding:40px;text-align:center;
font-size:42px;font-weight:800;}
</style>
</head>
<body>
<div class="tag">扎心真相 · 向上管理</div>
<h1>流水账周报<br><span class="hl">＝白写！</span></h1>
<div class="sub">干一样的活，为什么同事被夸<br>你却被领导忽略？</div>
<div class="cmp">
<div class="cbox bad"><div class="ct">这样写</div><div class="cline">周一开会<br>周二对接<br>周三写文档<br>……</div></div>
<div class="cbox good"><div class="ct">这样写</div><div class="cline">完成X项目<br>转化率提升20%<br>风险已解决<br>……</div></div>
</div>
<div class="bottom">3个最常见错误，今天一次说清</div>
</body>
</html>
