<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1440px;overflow:hidden;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#FDF8F4;

.url .u{font-size:74px;font-weight:900;color:#fff;letter-spacing:1px;}
.url .n{font-size:34px;color:#FDE7E0;margin-top:14px;}
.cta{margin-top:auto;font-size:40px;color:#9c3322;font-weight:800;text-align:center;}

</head>

</div>
