<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1440px;overflow:hidden;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#FDF8F4;
display:flex;flex-direction:column;padding:90px 80px;}
.tag{align-self:flex-start;background:#F4E2DB;color:#C8442F;font-size:34px;font-weight:700;
padding:14px 32px;border-radius:999px;margin-bottom:44px;}
h1{font-size:92px;font-weight:900;color:#23272E;line-height:1.15;margin-bottom:46px;}
.bad{background:#fff;border-radius:24px;padding:36px 42px;margin-bottom:28px;
box-shadow:0 6px 22px rgba(200,68,47,0.07);}
.bad .h{display:flex;align-items:center;font-size:44px;font-weight:900;color:#D0523F;margin-bottom:12px;}
.x{width:52px;height:52px;border-radius:50%;background:#F6D9D2;color:#C8442F;font-size:38px;
display:flex;align-items:center;justify-content:center;margin-right:22px;flex-shrink:0;font-weight:900;}
.bad .d{font-size:35px;color:#5b626b;line-height:1.45;padding-left:74px;}
.good{margin-top:auto;background:#E7F2E6;border-radius:22px;padding:36px 42px;}
.good .h{font-size:42px;font-weight:900;color:#3c7a39;margin-bottom:12px;}
.good .d{font-size:36px;color:#3c5438;line-height:1.5;}
</style>
</head>
<body>
<div class="tag">避坑指南</div>
<h1>这3个坑别再踩</h1>
<div class="bad"><div class="h"><span class="x">×</span>流水账式</div><div class="d">周一开会、周二对接、周三写文档……只有过程，没有产出。</div></div>
<div class="bad"><div class="h"><span class="x">×</span>报喜不报忧</div><div class="d">问题全藏着，领导反而不放心，风险拖到爆雷更被动。</div></div>
<div class="bad"><div class="h"><span class="x">×</span>计划写"持续推进"</div><div class="d">没有动作和时间点，等于下周什么都没计划。</div></div>
<div class="good"><div class="h">正确写法记住一句话</div><div class="d">做了什么 → 拿到什么结果 → 下一步怎么办，全程多用数据说话。</div></div>
</body>
</html>
